spring:
  application:
    name: apigateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # Account Service
            # =========================
            - id: accountservice
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**

              # Rate Limiter - enable later
              # filters:
              #   - name: RequestRateLimiter
              #     args:
              #       redis-rate-limiter.replenishRate: 10
              #       redis-rate-limiter.burstCapacity: 20


            # =========================
            # Transaction Service
            # =========================
            - id: transactionservice
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/transactions/**

              # Rate Limiter - enable later
              # filters:
              #   - name: RequestRateLimiter
              #     args:
              #       redis-rate-limiter.replenishRate: 10
              #       redis-rate-limiter.burstCapacity: 20


            # =========================
            # Payment Service
            # =========================
            - id: paymentservice
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/payments/**

              # Rate Limiter - enable later
              # filters:
              #   - name: RequestRateLimiter
              #     args:
              #       redis-rate-limiter.replenishRate: 5
              #       redis-rate-limiter.burstCapacity: 10


server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: unrestricted